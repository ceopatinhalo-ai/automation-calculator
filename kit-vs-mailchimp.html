<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Marketing Cost Calculator: Kit vs Mailchimp (2026 Edition)</title>
  <meta name="description" content="Interactive ROI calculator comparing subscriber pricing and true delivery costs between Kit (ConvertKit) and Mailchimp in 2026.">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(17, 24, 39, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #0099ff;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, sans-serif; }
    body {
      background-color: var(--bg);
      background-image: radial-gradient(at 0% 0%, rgba(0, 153, 255, 0.15) 0px, transparent 50%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px;
    }
    .container { width: 100%; max-width: 820px; }
    header { text-align: center; margin-bottom: 32px; }
    .nav-back {
      display: inline-flex;
      align-items: center;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.85rem;
      margin-bottom: 16px;
      padding: 6px 14px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 9999px;
    }
    h1 { font-size: 2.1rem; font-weight: 800; margin-bottom: 10px; color: #fff; }
    .subtitle { color: var(--text-muted); font-size: 1rem; line-height: 1.5; }
    .calc-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 28px;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
      margin-bottom: 24px;
    }
    .slider-head { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: 600; }
    input[type=range] { width: 100%; height: 8px; border-radius: 4px; background: #1e293b; outline: none; margin-bottom: 24px; }
    .result-box {
      background: rgba(0, 153, 255, 0.1);
      border: 1px solid rgba(0, 153, 255, 0.3);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      margin: 20px 0;
    }
    .result-amount { font-size: 2.2rem; font-weight: 800; color: #38bdf8; }
    .cta-btn {
      display: block;
      width: 100%;
      padding: 16px 20px;
      background: linear-gradient(135deg, #0099ff, #007acc);
      color: white;
      text-align: center;
      border-radius: 12px;
      font-weight: 800;
      text-decoration: none;
      font-size: 1.05rem;
      box-shadow: 0 8px 24px rgba(0, 153, 255, 0.35);
    }
  </style>
  <meta name="twitter:card" content="summary_large_image">
  <meta property="og:image" content="https://ceopatinhalo-ai.github.io/automation-calculator/assets/og-preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:image" content="https://ceopatinhalo-ai.github.io/automation-calculator/assets/og-preview.png">
</head>
<body>
  <div class="container">
    <header>
      <a href="index.html" class="nav-back">← Back to AutoFlow Vault</a>
      <h1>Email Marketing Cost Calculator: Kit vs Mailchimp</h1>
      <p class="subtitle">Calculate realistic subscription overhead and long-term list savings for solopreneurs.</p>
    </header>
    <div class="calc-card">
      <div class="slider-head">
        <span>Email List Size:</span>
        <span id="scale-val" style="color: #38bdf8;">10,000 subscribers</span>
      </div>
      <input type="range" id="scale-slider" min="1000" max="50000" step="1000" value="10000" oninput="calculate()">
      
      <div class="result-box">
        <div style="font-size: 0.9rem; color: #94a3b8;">Estimated Annual Savings Switching to Kit:</div>
        <div class="result-amount" id="savings-val">$1,200 / year</div>
      </div>

      <a href="https://kit.com?via=autoflow" target="_blank" rel="noopener sponsored" class="cta-btn">
        ⚡ Start Free Trial on Kit (ConvertKit)
      </a>
    </div>
  </div>
  <script>
    function calculate() {
      const val = parseInt(document.getElementById('scale-slider').value);
      document.getElementById('scale-val').innerText = val.toLocaleString() + ' subscribers';
      const savings = Math.round(val * 0.12);
      document.getElementById('savings-val').innerText = '$' + savings.toLocaleString() + ' / year';
    }
  </script>
</body>
</html>
